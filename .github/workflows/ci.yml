name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-lint:
    name: Backend Linting & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: darukaa_geospatial_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          python -m ruff check backend/
          python -m ruff format --check backend/

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/darukaa_geospatial_test
          JWT_SECRET_KEY: test_secret_key_ci_environment_32_characters!
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Populate Seed Data
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/darukaa_geospatial_test
          JWT_SECRET_KEY: test_secret_key_ci_environment_32_characters!
        run: |
          python database/seed/seed_data.py

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/darukaa_geospatial_test
          JWT_SECRET_KEY: test_secret_key_ci_environment_32_characters!
        run: |
          python -m pytest backend/tests -v

  frontend-build-and-lint:
    name: Frontend Linting & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Vitest Unit & Integration Tests
        run: |
          cd frontend
          npm test

      - name: Verify TypeScript & Build Vite Production Bundle
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
          VITE_MAPBOX_ACCESS_TOKEN: pk.placeholder_ci_token_for_vite_build
        run: |
          cd frontend
          npm run build
