name: Deployment Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

jobs:
  deploy-backend:
    name: Deploy FastAPI Backend (e.g. Render / Cloud)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Deploy hook dispatched to Render."
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK secret not configured. Skipping automated webhook dispatch."
          fi

  deploy-frontend:
    name: Deploy Vite React Frontend (e.g. Vercel)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & Deploy Notice
        run: |
          echo "Frontend is pre-configured for zero-config deployment on Vercel or Render."
          echo "Root directory: frontend"
          echo "Build command: npm run build"
          echo "Output directory: dist"
